    <circle cx="1340" cy="512" r="1.4" fill="#bfff54"/>
    <circle cx="248" cy="566" r="1.3" fill="#bfff54"/>
  </g>

  <ellipse cx="800" cy="392" rx="604" ry="292" fill="url(#globeCore)" filter="url(#softGlow)"/>
  <ellipse cx="800" cy="392" rx="604" ry="292" fill="none" stroke="#9cff00" stroke-opacity=".55" stroke-width="2.2" filter="url(#hardGlow)"/>

  <g clip-path="url(#globeClip)">
